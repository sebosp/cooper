[package]
name = "cooper"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/sebosp/cooper"
description = "Online SC2Replay analyser, the replays are read in the browser"

[dependencies]
# The replays are read from the bytes of the dropped files, from_bytes is new in s2protocol 4.
s2protocol = { git = "https://github.com/sebosp/s2protocol-rs", rev = "7724f5b5482e75ba4f0477f79125d8e7238d1d27", default-features = false, features = ["tracing_off"] }

# The web application, the analysis of the replays is tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "0.23", features = ["csr"] }
plotters = "0.3"
plotters-canvas = "0.3"
gloo = { version = "0.12", features = ["file", "net"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["DragEvent", "DataTransfer", "File", "FileList", "HtmlCanvasElement", "HtmlInputElement"] }
